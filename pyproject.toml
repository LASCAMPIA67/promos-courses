[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-promos"
dynamic = ["version"]
description = "Robot qui récupère chaque jour les promos de nos magasins (Lidl Lingolsheim, E.Leclerc Geispolsheim)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Emilio" }]
dependencies = [
    "requests>=2.32,<3",
    "pdfplumber>=0.11.4,<0.12",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.3",
]

[project.urls]
"Code source" = "https://github.com/lascampia67/promos-courses"
"Journal des versions" = "https://github.com/lascampia67/promos-courses/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "robot_promos.__version__" }

[tool.setuptools.package-data]
robot_promos = ["promos.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Règles choisies dans https://docs.astral.sh/ruff/rules/ : erreurs, style, imports, pièges
# courants, modernisation, sécurité (bandit), dates sans fuseau, simplifications, pytest.
select = [
    "E", "F", "W",  # pycodestyle, Pyflakes
    "I",            # ordre des imports
    "B",            # pièges courants (bugbear)
    "UP",           # syntaxe moderne
    "BLE",          # pas de « except Exception » sans raison
    "S",            # sécurité (bandit)
    "DTZ",          # dates avec fuseau horaire
    "SIM", "C4", "PIE", "RET", "PERF", "FURB",  # code plus simple
    "PTH",          # pathlib plutôt que os.path
    "LOG", "G",     # journalisation
    "PT",           # bonnes pratiques pytest
    "RUF",          # règles propres à Ruff
]
ignore = ["E741"]
# Apostrophe typographique française : voulue dans les textes.
allowed-confusables = ["’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert est la façon normale d'écrire un test pytest

[tool.ruff.format]
quote-style = "double"
