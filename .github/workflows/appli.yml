# Teste l'appli (logique + scénarios réels sur l'émulateur Firebase), puis la publie sur GitHub Pages :
# https://lascampia67.github.io/promos-courses/
name: Appli

on:
  push:
    branches: [main]
    paths: ["app/**", "firebase/**", ".nvmrc", ".prettierrc.json", ".github/workflows/appli.yml"]
  pull_request:
    paths: ["app/**", "firebase/**", ".nvmrc", ".prettierrc.json", ".github/workflows/appli.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparer:
    name: Préparer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.version.outputs.playwright }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lire la version de Playwright utilisée par l'appli
        id: version
        run: echo "playwright=$(node -p "require('./app/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  verifier:
    name: Tester et construire l'appli
    needs: preparer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Image officielle de Playwright : Chrome et Safari (WebKit) y sont déjà installés, avec leurs
    # dépendances. Plus rapide et plus fiable que de les installer à chaque fois.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.preparer.outputs.playwright }}-noble
    defaults:
      run:
        working-directory: app
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer Java (nécessaire aux émulateurs Firebase)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les outils
        run: npm ci

      - name: Vérifier le code (ESLint)
        run: npm run lint -- --max-warnings 0

      - name: Vérifier la mise en forme (Prettier)
        run: npm run format:check

      - name: Tests de logique
        run: npm test

      - name: Scénarios réels sur l'émulateur Firebase
        run: npm run e2e

      - name: Garder les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-playwright
          path: app/test-results
          retention-days: 7

      - name: Construire l'appli
        run: npm run build

      - name: Préparer la publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  # Contrôle qualité de l'appli construite, avec Lighthouse (Google) : rapidité, accessibilité et
  # bonnes pratiques de l'écran d'accueil. Ne bloque pas la publication ; les rapports sont gardés
  # 14 jours (onglet du lancement → « Artifacts »).
  qualite:
    name: Contrôle qualité (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les outils
        run: npm ci

      - name: Construire l'appli
        run: npm run build

      - name: Mesurer avec Lighthouse
        run: npm run qualite

      - name: Garder les rapports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-lighthouse
          path: app/lighthouse
          retention-days: 14

  publier:
    name: Publier sur GitHub Pages
    needs: verifier
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Vérifier que GitHub Pages est activé
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null) && [ "$source" = "workflow" ]; then
            echo "actif=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=GitHub Pages n'est pas encore activé::Dans le dépôt : Settings → Pages → Source : « GitHub Actions », puis relancer ce workflow."
            echo "actif=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier
        id: deploiement
        if: steps.pages.outputs.actif == 'oui'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
