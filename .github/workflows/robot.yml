# Fait tourner le robot des promos chaque matin, et à la demande (bouton « Run workflow »).
name: Robot des promos

on:
  schedule:
    # Tous les jours à 5 h 47, heure de Paris (GitHub gère lui-même l'heure d'été / d'hiver).
    # Pas pile à l'heure : GitHub est surchargé à chaque heure pile et prend du retard.
    - cron: "47 5 * * *"
      timezone: "Europe/Paris"
    # Rattrapages : GitHub retarde ou oublie parfois un lancement programmé. Ceux-ci ne font rien
    # si le robot a déjà été lancé dans la journée (un seul passage par jour sur les sites).
    - cron: "17 8 * * *"
      timezone: "Europe/Paris"
    - cron: "37 12 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      sans_cache:
        description: "Relire tous les catalogues, même ceux qui n'ont pas changé"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: robot-promos

jobs:
  robot:
    name: Récupérer les promos
    runs-on: ubuntu-latest
    # Jusqu'à 60 minutes de photos (voir --minutes-photos) : les premières fois, il y en a beaucoup.
    timeout-minutes: 90
    permissions:
      contents: write # pour pouvoir enregistrer promos.json et les photos dans le dépôt
      actions: read # pour savoir si le robot a déjà été lancé aujourd'hui
    steps:
      # Un lancement programmé ne fait rien si le robot a déjà été lancé aujourd'hui (heure de
      # Paris), à la main ou par un autre horaire. Un lancement à la main passe toujours.
      - name: Vérifier si le robot est déjà passé aujourd'hui
        id: aujourdhui
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minuit=$(date -u -d "TZ=\"Europe/Paris\" $(TZ=Europe/Paris date +%F) 00:00" +%Y-%m-%dT%H:%M:%SZ)
          deja=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/robot.yml/runs" \
            -f created=">=$minuit" -f per_page=50 \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")] | length")
          if [ "$deja" -gt 0 ]; then
            echo "Le robot a déjà été lancé aujourd'hui : rien à faire (un seul passage par jour)."
            echo "Le robot a déjà été lancé aujourd'hui : rien à faire (un seul passage par jour)." >> "$GITHUB_STEP_SUMMARY"
            echo "deja_passe=oui" >> "$GITHUB_OUTPUT"
          fi

      # Le jeton git reste disponible pendant ce travail : il sert à enregistrer promos.json et les
      # photos (rien d'autre n'est envoyé ni partagé depuis ce travail).
      - name: Récupérer le dépôt
        if: steps.aujourdhui.outputs.deja_passe != 'oui'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Python
        if: steps.aujourdhui.outputs.deja_passe != 'oui'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le robot
        if: steps.aujourdhui.outputs.deja_passe != 'oui'
        run: pip install .

      # Les vignettes des photos des produits sont dans la branche « photos » : on reprend celles déjà
      # faites, pour ne télécharger que les nouvelles.
      - name: Reprendre les photos déjà faites
        if: steps.aujourdhui.outputs.deja_passe != 'oui'
        run: |
          mkdir -p "$RUNNER_TEMP/photos"
          if git fetch --depth=1 origin photos; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/photos"
            git rev-parse "FETCH_HEAD^{tree}" > "$RUNNER_TEMP/arbre-photos"
          fi

      - name: Lancer le robot
        if: steps.aujourdhui.outputs.deja_passe != 'oui'
        env:
          SANS_CACHE: ${{ inputs.sans_cache }}
        run: |
          options=(--photos "$RUNNER_TEMP/photos" --minutes-photos 60)
          if [ "$SANS_CACHE" = "true" ]; then
            options+=(--sans-cache)
          fi
          python -m robot_promos "${options[@]}"

      # La branche « photos » est réécrite à chaque fois, en un seul enregistrement : elle ne garde que
      # les photos des promos en cours, sans historique (le dépôt ne grossit pas). Elle est publiée
      # avant promos.json, pour que l'appli ne cherche jamais une photo qui n'existe pas encore.
      - name: Enregistrer les photos
        if: steps.aujourdhui.outputs.deja_passe != 'oui'
        run: |
          printf '%s\n' "# Photos des produits" "" \
            "Vignettes des photos des promos en cours, écrites chaque matin par le robot" \
            "(voir src/robot_promos/photos.py sur la branche main). Cette branche est réécrite à" \
            "chaque passage : ne rien y modifier à la main." > "$RUNNER_TEMP/photos/LISEZMOI.md"
          depot="$PWD/.git"
          cd "$RUNNER_TEMP/photos"
          export GIT_DIR="$depot" GIT_WORK_TREE="$PWD" GIT_INDEX_FILE="$RUNNER_TEMP/index-photos"
          git add -A .
          arbre=$(git write-tree)
          if [ "$arbre" = "$(cat "$RUNNER_TEMP/arbre-photos" 2>/dev/null)" ]; then
            echo "Photos inchangées."
          else
            enregistrement=$(git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit-tree "$arbre" -m "Photos du $(TZ=Europe/Paris date +%d/%m/%Y)")
            git push --force origin "$enregistrement:refs/heads/photos"
          fi

      - name: Enregistrer promos.json
        if: steps.aujourdhui.outputs.deja_passe != 'oui'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promos.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Promos du $(TZ=Europe/Paris date +%d/%m/%Y)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
