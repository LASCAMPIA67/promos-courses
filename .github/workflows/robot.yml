# Fait tourner le robot des promos chaque matin, et à la demande (bouton « Run workflow »).
name: Robot des promos

on:
  schedule:
    # Tous les jours à 5 h 47, heure de Paris (GitHub gère lui-même l'heure d'été / d'hiver).
    # Pas pile à l'heure : GitHub est surchargé à chaque heure pile et prend du retard.
    - cron: "47 5 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      sans_cache:
        description: "Relire tous les catalogues, même ceux qui n'ont pas changé"
        type: boolean
        default: false

permissions:
  contents: write # pour pouvoir enregistrer promos.json dans le dépôt

concurrency:
  group: robot-promos

jobs:
  robot:
    name: Récupérer les promos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le robot
        run: pip install .

      - name: Lancer le robot
        run: python -m robot_promos ${{ inputs.sans_cache && '--sans-cache' || '' }}

      - name: Enregistrer promos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promos.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Promos du $(TZ=Europe/Paris date +%d/%m/%Y)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
