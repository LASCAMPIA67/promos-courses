# Vérifie les règles d'accès Firestore (liste de courses commune) sur l'émulateur Firebase.
name: Règles Firebase

on:
  push:
    branches: [main]
    paths: ["firebase/**", ".nvmrc", ".prettierrc.json", ".github/workflows/regles.yml"]
  pull_request:
    paths: ["firebase/**", ".nvmrc", ".prettierrc.json", ".github/workflows/regles.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regles:
    name: Tester les règles d'accès
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Installer Java (nécessaire à l'émulateur Firestore)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les outils
        run: npm ci

      - name: Vérifier le code et sa mise en forme (ESLint, Prettier)
        run: |
          npm run lint -- --max-warnings 0
          npm run format:check

      - name: Lancer les tests des règles
        run: npm test
