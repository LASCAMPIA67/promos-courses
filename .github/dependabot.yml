# Dependabot propose automatiquement les mises à jour des outils utilisés (une fois par mois).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /firebase
    schedule:
      interval: monthly
    groups:
      firebase:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      appli:
        patterns: ["*"]
